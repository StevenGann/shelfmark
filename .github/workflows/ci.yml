name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy app

      - name: Tests
        run: pytest -q

  image:
    name: Build and publish image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The cluster is arm64 and a workstation is amd64; publishing one arch
      # would make the image undeployable on half the estate.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/stevengann/shelfmark:main
            ghcr.io/stevengann/shelfmark:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Pushed ghcr.io/stevengann/shelfmark@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Hyperion
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the homelab repo
        uses: actions/checkout@v6
        with:
          repository: StevenGann/homelab
          token: ${{ secrets.HOMELAB_TOKEN }}
          path: homelab

      - name: Pin the new image tag
        run: |
          set -euo pipefail
          file=homelab/Hyperion/k8s/apps/shelfmark/deployment.yaml
          test -f "$file"
          sed -i -E "s#image: ghcr.io/stevengann/shelfmark:.*#image: ghcr.io/stevengann/shelfmark:sha-${GITHUB_SHA}#" "$file"
          grep -n "image:" "$file"

      - name: Commit and push
        run: |
          set -euo pipefail
          cd homelab
          git config user.name "shelfmark-ci"
          git config user.email "ci@users.noreply.github.com"
          if git diff --quiet; then
            echo "already pinned to ${GITHUB_SHA}; nothing to do"
            exit 0
          fi
          git commit -am "shelfmark: deploy ${GITHUB_SHA:0:7}"
          git push
