name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor in pyproject; 3.12 is what the image runs. Testing
        # both keeps the floor honest instead of aspirational.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy app

      - name: Tests (coverage gate 83%, currently 84%)
        run: |
          pytest -q \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=83

      - name: Console script works from an installed copy
        # Every test runs against the source tree, where ``app/`` sits beside the
        # migrations. The image runs the installed package instead, and that
        # difference once meant the break-glass CLI could not create a schema on
        # a fresh volume. Install into a throwaway venv and use it from /tmp.
        env:
          SHELFMARK_DATA_DIR: /tmp/installed-data
        run: |
          set -euo pipefail
          python -m venv /tmp/installed
          /tmp/installed/bin/pip install -q .
          cd /tmp
          printf 'correct-horse-9\n' | /tmp/installed/bin/shelfmark user create smoke --role admin
          /tmp/installed/bin/python -c "
          import sqlite3
          rows = sqlite3.connect('/tmp/installed-data/shelfmark.db').execute(
              \"select count(*) from sqlite_master where type='table'\").fetchone()[0]
          assert rows > 20, rows
          print('installed copy created', rows, 'tables')
          "

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Test coverage"
            echo '```'
            coverage report | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: Security lint (bandit)
        run: bandit -q -c pyproject.toml -r app -ll

      - name: Dependency audit (pip-audit)
        # The runner's own setuptools is in scope: a vulnerable build tool is
        # still a vulnerable build tool. The floor in [build-system] keeps the
        # build environment from resolving an older one.
        run: pip-audit --progress-spinner off

  image:
    name: Build and publish image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The cluster is arm64 and a workstation is amd64; publishing one arch
      # would make the image undeployable on half the estate.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/stevengann/shelfmark:main
            ghcr.io/stevengann/shelfmark:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Pushed ghcr.io/stevengann/shelfmark@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Hyperion
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the homelab repo
        uses: actions/checkout@v6
        with:
          repository: StevenGann/homelab
          token: ${{ secrets.HOMELAB_TOKEN }}
          path: homelab

      - name: Pin the new image tag
        run: |
          set -euo pipefail
          dir=homelab/Hyperion/k8s/apps/shelfmark
          test -d "$dir"
          # The deployment and every CronJob run the same image; pin all of them
          # so a scheduled job cannot silently keep running last week's code.
          mapfile -t files < <(grep -rl 'ghcr.io/stevengann/shelfmark:' "$dir")
          test "${#files[@]}" -gt 0
          sed -i -E "s#image: ghcr.io/stevengann/shelfmark:.*#image: ghcr.io/stevengann/shelfmark:sha-${GITHUB_SHA}#" "${files[@]}"
          grep -rn "image: ghcr.io/stevengann/shelfmark:" "$dir"

      - name: Commit and push
        run: |
          set -euo pipefail
          cd homelab
          git config user.name "shelfmark-ci"
          git config user.email "ci@users.noreply.github.com"
          if git diff --quiet; then
            echo "already pinned to ${GITHUB_SHA}; nothing to do"
            exit 0
          fi
          git commit -am "shelfmark: deploy ${GITHUB_SHA:0:7}"
          git push
