[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfmark"
version = "0.1.0"
description = "Parts inventory and BOM management for electronics assembly"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.3",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "zxing-cpp>=2.2",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
shelfmark = "app.cli:main"

[tool.setuptools.packages.find]
# Without this, setuptools' flat-layout auto-discovery shipped only app/*.py:
# the image had no app.repo, so the console script died on import while the
# server kept working off the source tree in /app.
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/**/*.html", "static/*", "migrations/*.sql"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# Each skip is a deliberate call, not an oversight:
#   B104 - the container is expected to bind 0.0.0.0; the port is the exposure.
#   B310 - query URLs come from the seeded distributor templates, never from user input.
#   B608 - the interpolated fragments are fixed clause lists and sort orders; every value is
#          bound as a parameter.
skips = ["B104", "B310", "B608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
# Ruff formats Python inside Markdown too; documentation code blocks are
# illustrative, not source, and get mangled by it.
extend-exclude = ["*.md"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

