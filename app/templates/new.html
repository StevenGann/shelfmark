{% extends "base.html" %}
{% block title %}New part · Shelfmark{% endblock %}
{% block content %}
<div class="page-head">
  <h1>New part</h1>
  <span class="sub">An internal part number is assigned when you save.</span>
  <div class="page-actions">
    <a class="button ghost" href="/">Cancel</a>
  </div>
</div>

{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

<section class="card" style="max-width:44rem">
  <form method="post" action="/parts/new" class="part-form">
    <label>MPN
      <input name="mpn" value="{{ form.get('mpn', '') }}" required autofocus>
    </label>
    <label>Manufacturer
      <input name="manufacturer" value="{{ form.get('manufacturer', '') }}" required>
    </label>
    <label>Description
      <input name="description" value="{{ form.get('description', '') }}">
    </label>
    <label>Category
      <input name="category" value="{{ form.get('category', '') }}">
    </label>
    <label>Notes
      <textarea name="notes" rows="3">{{ form.get('notes', '') }}</textarea>
    </label>
    <label>Design status
      <select name="design_status">
        {% for s in statuses %}
        <option value="{{ s }}" {% if form.get('design_status', 'active') == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="actions">
      <button type="submit" class="primary">Create part</button>
      <a class="button" href="/">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
