{% extends "base.html" %}
{% block title %}Account · Shelfmark{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Account</h1>
  <span class="sub">{{ current_user.username }} · {{ current_user.role }}</span>
</div>

{% if ok %}<div class="notice" role="status">Password changed.</div>{% endif %}
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

<section class="card" style="max-width:32rem">
  <div class="card-head">
    <h2>Change password</h2>
  </div>
  <form method="post" action="/account" class="part-form">
    <label>Current password
      <input name="current_password" type="password" autocomplete="current-password" required>
    </label>
    <label>New password
      <input name="new_password" type="password" autocomplete="new-password" required>
    </label>
    <label>Confirm new password
      <input name="new_password_confirm" type="password" autocomplete="new-password" required>
    </label>
    <div class="actions">
      <button type="submit" class="primary">Change password</button>
    </div>
  </form>
</section>
{% endblock %}
