<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shelfmark{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="/"><img src="/static/favicon.svg" alt="">Shelfmark</a>
      {% if current_user %}
      {% set path = request.url.path %}
      <nav aria-label="Main">
        <a class="nav-link" href="/" {% if path == "/" or path.startswith("/parts") %}aria-current="page"{% endif %}>Parts</a>
        <a class="nav-link" href="/stock" {% if path.startswith("/stock") %}aria-current="page"{% endif %}>Stock</a>
        <a class="nav-link" href="/projects" {% if path.startswith("/projects") %}aria-current="page"{% endif %}>Projects</a>
        <a class="nav-link" href="/builds" {% if path.startswith("/builds") %}aria-current="page"{% endif %}>Builds</a>
        {% if current_user.role == 'admin' %}
        <a class="nav-link" href="/users" {% if path.startswith("/users") %}aria-current="page"{% endif %}>Users</a>
        {% endif %}
      </nav>
      <div class="user">
        <a class="user-info" href="/account" title="Account settings">{{ current_user.username }} · {{ current_user.role }}</a>
        <form method="post" action="/logout" class="logout">
          <button type="submit">Log out</button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
