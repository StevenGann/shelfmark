<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shelfmark{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <a class="brand" href="/">Shelfmark</a>
    {% if current_key %}
    <span class="key-info">{{ current_key.name }} · {{ current_key.role }}</span>
    <form method="post" action="/logout" class="logout">
      <button type="submit">Log out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
