{% extends "base.html" %}
{% block title %}Set up · Shelfmark{% endblock %}
{% block content %}
<div class="login-card">
  <img class="login-mark" src="/static/favicon.svg" alt="">
  <h1>Create the first admin</h1>
  <p class="muted">No accounts exist yet. Claim this instance by creating the first administrator.</p>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/setup" class="login-form">
    <label>Username
      <input name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password (at least 12 characters)
      <input name="password" type="password" autocomplete="new-password" required>
    </label>
    <label>Confirm password
      <input name="password_confirm" type="password" autocomplete="new-password" required>
    </label>
    <button type="submit" class="primary">Create account</button>
  </form>
</div>
{% endblock %}
